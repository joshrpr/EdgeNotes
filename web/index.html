<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090D10">
<meta name="robots" content="noindex">
<meta name="description" content="Edge Notes - remember the sharpening angle of every knife.">
<title>Edge Notes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23090D10'/%3E%3Cpath d='M9 25L23 6l4 3L15 26z' fill='%23D8A34A'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/ShipporiMincho-600-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/ShipporiMincho-500-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
    <defs>
      <linearGradient id="steel-fill" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#4C5E68"/>
        <stop offset=".45" stop-color="#223037"/>
        <stop offset="1" stop-color="#121C21"/>
      </linearGradient>
    </defs>
  </svg>
  <div id="app"></div>
  <div class="blade" aria-hidden="true"><i></i></div>
  <div id="dialog" class="dialog-layer" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <input id="file-camera" type="file" accept="image/*" capture="environment" hidden>
  <input id="file-gallery" type="file" accept="image/*" hidden>
  <input id="file-restore" type="file" accept="application/json,.json" hidden>
  <noscript><p style="padding:24px">Edge Notes needs JavaScript turned on.</p></noscript>
  <script src="js/core.js"></script>
  <script src="js/store.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/native.js"></script>
  <script src="js/route.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
